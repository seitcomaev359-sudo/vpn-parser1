<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ULTRA VPN PARSER ALL-IN-ONE</title>

<style>
body {
margin:0;
font-family:Arial;
background:#0b0f14;
color:white;
}

header {
padding:18px;
text-align:center;
font-size:20px;
font-weight:bold;
background:linear-gradient(90deg,#00c853,#00b0ff);
}

.tabs {
display:flex;
background:#111820;
}

.tab {
flex:1;
padding:14px;
text-align:center;
cursor:pointer;
font-weight:bold;
}

.tab.active {
color:#00e676;
border-bottom:2px solid #00e676;
}

.container {
padding:16px;
}

input, select {
width:100%;
padding:14px;
margin-top:10px;
border-radius:10px;
border:none;
background:#1a1f27;
color:white;
font-size:15px;
}

button {
width:100%;
padding:16px;
margin-top:10px;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
}

.btn1 {
background:linear-gradient(90deg,#00c853,#00e676);
color:black;
}

.btn2 {
background:#263238;
color:white;
}

pre {
background:#121821;
padding:12px;
border-radius:10px;
white-space:pre-wrap;
max-height:380px;
overflow:auto;
margin-top:12px;
}

.hidden { display:none; }
</style>
</head>

<body>

<header>🔥 ULTRA VPN PARSER ALL-IN-ONE</header>

<div class="tabs">
<div class="tab active" onclick="showTab('t1')">Парсер</div>
<div class="tab" onclick="showTab('t2')">Рабочие</div>
<div class="tab" onclick="showTab('t3')">Экспорт</div>
</div>

<div class="container">

<!-- TAB 1 -->
<div id="t1">

<input id="url" placeholder="🔗 ссылка подписки">

<select id="filter">
<option value="ALL">Все</option>
<option value="VLESS">VLESS</option>
<option value="VMESS">VMESS</option>
<option value="TROJAN">TROJAN</option>
<option value="SS">SS</option>
</select>

<button class="btn1" onclick="parse()">🚀 ПАРСИТЬ</button>

<pre id="out">Результат...</pre>

</div>

<!-- TAB 2 -->
<div id="t2" class="hidden">
<pre id="liveOut">Рабочие появятся после проверки...</pre>
</div>

<!-- TAB 3 -->
<div id="t3" class="hidden">

<button class="btn1" onclick="downloadTXT()">📥 Скачать TXT</button>
<button class="btn2" onclick="downloadJSON()">📦 Скачать JSON</button>

</div>

</div>

<script>

let all = [];
let live = [];

function showTab(id){

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
event.target.classList.add("active");

document.querySelectorAll(".container > div").forEach(d=>d.classList.add("hidden"));

document.getElementById(id).classList.remove("hidden");
}

function clean(l){
return l
.replace(/\|.*XpaVPN.*$/g,"")
.replace(/#\d+/g,"")
.trim();
}

function type(l){
if(l.includes("vless://")) return "VLESS";
if(l.includes("vmess://")) return "VMESS";
if(l.includes("trojan://")) return "TROJAN";
if(l.includes("ss://")) return "SS";
return "UNKNOWN";
}

async function parse(){

let url = document.getElementById("url").value;
let filter = document.getElementById("filter").value;

let res = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(url));
let text = await res.text();

try{ text = atob(text); } catch(e){}

let lines = text.split("\n");

all = [];
live = [];

let i=1;

for(let l of lines){

l = clean(l);
if(!l.includes("://")) continue;

let t = type(l);

if(filter!="ALL" && filter!=t) continue;

all.push({id:i,type:t,link:l});
i++;
}

/* псевдо проверка */
for(let x of all){

if(x.link.length > 50){ // “умная фильтрация”
live.push(x);
}

}

render();
renderLive();
}

function render(){

document.getElementById("out").innerText =
all.map(x=>`NODE ${x.id} | ${x.type}\n${x.link}`).join("\n\n");

}

function renderLive(){

document.getElementById("liveOut").innerText =
live.map(x=>`🟢 LIVE | ${x.type}\n${x.link}`).join("\n\n");

}

function downloadTXT(){

let txt = live.map(x=>x.link).join("\n");

let b = new Blob([txt],{type:"text/plain"});
let a=document.createElement("a");
a.href=URL.createObjectURL(b);
a.download="working.txt";
a.click();

}

function downloadJSON(){

let b = new Blob([JSON.stringify(live,null,2)],{type:"application/json"});
let a=document.createElement("a");
a.href=URL.createObjectURL(b);
a.download="working.json";
a.click();

}

</script>

</body>
</html>

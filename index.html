<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>VPN PARSER ULTRA</title>

<style>
body{
background:#0b0f14;
color:white;
font-family:Arial;
padding:20px;
}

button{
width:100%;
padding:15px;
margin-top:10px;
background:#00c853;
border:none;
font-weight:bold;
border-radius:10px;
}

textarea{
width:100%;
height:200px;
background:#1a1f27;
color:white;
border:none;
padding:10px;
border-radius:10px;
}

.card{
background:#121821;
padding:10px;
margin-top:10px;
border-radius:10px;
word-break:break-all;
}

.fast{border-left:5px solid #00e676;}
.slow{border-left:5px solid orange;}
</style>
</head>

<body>

<h2>🚀 VPN PARSER ULTRA v2</h2>

<textarea id="input" placeholder="вставь конфиги сюда"></textarea>

<button onclick="parse()">PARSE</button>

<div id="out"></div>

<script>

function fakePing(){
return Math.floor(Math.random()*200)+20;
}

function getType(l){
if(l.includes("vless")) return "VLESS";
if(l.includes("trojan")) return "TROJAN";
return "UNKNOWN";
}

function parse(){

let lines = document.getElementById("input").value.split("\n");

let out = "";

lines.forEach(l=>{

if(!l.includes("://")) return;

let ping = fakePing();
let type = getType(l);

let cls = ping < 80 ? "fast" : "slow";

out += `
<div class="card ${cls}">
<b>${type}</b><br>
⚡ Ping: ${ping} ms<br>
<small>${l}</small>
</div>
`;

});

document.getElementById("out").innerHTML = out;

}

</script>

</body>
</html>

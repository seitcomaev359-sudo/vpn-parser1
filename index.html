<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ULTRA VPN PARSER CLEAN</title>

<style>
body {
margin:0;
font-family:Arial;
background:#0b0f14;
color:white;
}

header {
background:linear-gradient(90deg,#00c853,#00b0ff);
padding:18px;
text-align:center;
font-size:20px;
font-weight:bold;
}

/* INPUT AREA */
.container {
padding:16px;
}

input, select {
width:100%;
padding:14px;
margin-top:10px;
border-radius:10px;
border:none;
background:#1a1f27;
color:white;
font-size:15px;
}

/* BUTTONS */
button {
width:100%;
padding:16px;
margin-top:10px;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
}

.btn1 {
background:linear-gradient(90deg,#00c853,#00e676);
color:black;
}

.btn2 {
background:#263238;
color:white;
}

/* CARD OUTPUT */
.card {
background:#121821;
padding:12px;
margin-top:10px;
border-radius:12px;
word-break:break-all;
}

.node-title {
font-weight:bold;
color:#00e676;
}

.status {
margin-top:5px;
font-weight:bold;
}

.ping {
color:#00b0ff;
}

code {
display:block;
margin-top:8px;
color:#ccc;
font-size:12px;
}
</style>
</head>

<body>

<header>🔥 ULTRA VPN PARSER CLEAN v6</header>

<div class="container">

<input id="url" placeholder="🔗 Вставь подписку">

<select id="filter">
<option value="ALL">Все</option>
<option value="VLESS">VLESS</option>
<option value="VMESS">VMESS</option>
<option value="TROJAN">TROJAN</option>
<option value="SS">SS</option>
</select>

<button class="btn1" onclick="parse()">🚀 ПАРСИТЬ</button>
<button class="btn2" onclick="download()">📥 СКАЧАТЬ LIVE</button>

<div id="out"></div>

</div>

<script>

let data = [];
let live = [];

/* CLEAN */
function clean(l){
return l
.replace(/\|.*XpaVPN.*$/g,"")
.replace(/#\d+/g,"")
.trim();
}

/* TYPE */
function type(l){
if(l.includes("vless://")) return "VLESS";
if(l.includes("vmess://")) return "VMESS";
if(l.includes("trojan://")) return "TROJAN";
if(l.includes("ss://")) return "SS";
return "UNKNOWN";
}

/* NOISE FILTER */
function isNoise(l){
return !l ||
l.startsWith("#") ||
l.includes("profile-web-page-url") ||
l.includes("support-url") ||
l.includes("telegram") ||
l.length < 20;
}

/* FAKE SERVER FILTER */
function isFake(l){
return l.includes("127.0.0.1") ||
l.includes("00000000") ||
l.includes("localhost");
}

/* FAKE PING (UI ONLY) */
function fakePing(){
return Math.floor(Math.random()*180)+20;
}

/* PARSE */
async function parse(){

let url = document.getElementById("url").value;
let filter = document.getElementById("filter").value;

let res = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(url));
let text = await res.text();

try{ text = atob(text); }catch(e){}

let lines = text.split("\n");

data = [];
live = [];

let i = 1;

for(let l of lines){

if(isNoise(l)) continue;

l = clean(l);
if(!l.includes("://")) continue;
if(isFake(l)) continue;

let t = type(l);

if(filter !== "ALL" && filter !== t) continue;

/* SIMULATED STATUS */
let ping = fakePing();
let status = ping < 120 ? "🟢 FAST" : "🟡 SLOW";

data.push({
id:i,
type:t,
link:l,
ping:ping,
status:status
});

if(ping < 150){
live.push(data[data.length-1]);
}

i++;
}

render();

}

/* RENDER CARDS */
function render(){

document.getElementById("out").innerHTML =
data.map(x=>`
<div class="card">
<div class="node-title">NODE ${x.id}</div>
<div>${x.type}</div>
<div class="status">${x.status}</div>
<div class="ping">PING: ${x.ping} ms</div>
<code>${x.link}</code>
</div>
`).join("");

}

/* DOWNLOAD LIVE ONLY */
function download(){

let txt = live.map(x =>
`NODE ${x.id}
${x.type}
${x.status}
${x.ping}ms
${x.link}
-------------------`
).join("\n");

let b = new Blob([txt],{type:"text/plain"});
let a=document.createElement("a");
a.href=URL.createObjectURL(b);
a.download="LIVE_SERVERS.txt";
a.click();

}

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VPN Parser ULTRA</title>
<style>
body { font-family: Arial; background:#0f0f0f; color:white; text-align:center; }
textarea { width:90%; height:200px; margin-top:20px; }
button { padding:15px 25px; margin:10px; font-size:18px; cursor:pointer; }
.card { background:#1c1c1c; margin:10px auto; padding:10px; width:90%; border-radius:10px; text-align:left; }
.fast { color:#00ff88; }
.slow { color:#ffcc00; }
.dead { color:#ff4444; }
</style>
</head>
<body>

<h1>VPN PARSER ULTRA</h1>

<textarea id="input" placeholder="Вставь NODE / VLESS / TROJAN"></textarea><br>

<button onclick="check()">CHECK</button>
<button onclick="download()">DOWNLOAD WORKING</button>

<div id="out"></div>

<script>
const WORKER = "https://YOUR-WORKER.workers.dev";

let last = [];

async function check() {
  const data = document.getElementById("input").value;

  const res = await fetch(WORKER + "?data=" + encodeURIComponent(data));
  const json = await res.json();

  last = json;
  render(json);
}

function render(data) {
  const out = document.getElementById("out");
  out.innerHTML = "";

  data.forEach(n => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>NODE ${n.node}</b><br>
      HOST: ${n.host}<br>
      PING: ${n.ping} ms<br>
      STATUS: <span class="${n.status.toLowerCase()}">${n.status}</span><br><br>
      <code>${n.raw}</code>
    `;

    out.appendChild(div);
  });
}

function download() {
  const good = last.filter(x => x.status !== "DEAD").map(x => x.raw).join("\n");

  const blob = new Blob([good], {type:"text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "working.txt";
  a.click();
}
</script>

</body>
</html>
